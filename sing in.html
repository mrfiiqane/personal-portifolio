
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>sing in </title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />


        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif;
            }
            body{
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background: linear-gradient(to right, #6a11cb,
                #2575fc );
                background: linear-gradient(to left, #94b363,
                #c8d2e2 );
                background: linear-gradient(to bottom, #408286,
                #5e636d );
                overflow: hidden;
            }
            .form-container{
                background-color: #fff;
                padding: 50px;
                border-radius: 5px 50px 5px ;
                width: 100%;
                max-width: 400px;
                overflow: hidden;

            }
            h2{
                font-size: 1.5rem;
                font-weight: bolder;
                margin-bottom: 30px;
                text-align: center;
            }
            .form-group{
                margin-bottom: 10px;
            }
            .form-group label{
                display: block;
                margin-bottom: 8px;
                font-weight: bold;
                font-size: 1rem;
                color: #555;
            }
            .form-group input{
                width: 100%;
                padding: 10px;
                margin: 0 auto;
                border: 1.4px solid #2575fc;
                border-radius: 100px;
                font-size: 14px;
                transition: border-color 0.3s ease, box-shadow 0.3s ease;
            }
            .form-group input:hover {
                background-color: #bac7ff;
                color: #000000;
                border-color: #bdbdbd;
                box-shadow: 0 0 8px rgba(37, 117, 252, 0.2);
                outline: none;
            }
            .form-container button{
                width: 80%;
                padding: 8px;
                background-color: #2575fc;
                color: #fff;
                border: none;
                border-radius: 20px;
                font-size: 1rem;
                cursor: pointer;
                transition: background-color 0.3s ease, transform 0.1s ease;
                margin-top: 10px;
                font-weight: bold;
                position: sticky;
                margin: 10px 25px;
                

            }
            .form-container button[type="submit"]:hover {
                background-color: #8fb4f5;
                color: #555;
            }

            .form-container button[type="submit"]:active {
                transform: scale(1.25);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: large;
                font-style: italic;
                padding: 5px;

            }
            .background-circle{
                position: absolute;
                top: -100px;
                left: -100px;
                width: 500px;
                height: 300px;
                background-color: #bfcea4;
                border-radius: 50%;
                filter: blur(150px);
                z-index: 0;
            }
            .background-circle:nth-child(2){
                top: auto;
                bottom: -100px;
                right: -100px;
                left: auto;
            }
            .background-circle:nth-child(3){
                top: -100px;
                right: -100px;
                right: -100px;
                left: auto;
            }
            
            .form-container .social-icon-buttons{
                display: absolute;
                width: 220px;
                height: 30px;
                margin: 3px auto;
                margin-top: 10px;
                display: flex;
                gap: 20px;
            }
            .form-container .social-icon-buttons i{
                padding: 7px;
                background-color: #2575fc;
                text-align: center;
                border: none;
                border-radius: 10px;
                gap: 15px;
                width: 60%;
                color: #fff;
                transition: background-color 0.3s ease, transform 0.1s ease;
            }
            .form-container .social-icon-buttons:hover{

                background-color: #8fb4f5;
                color: #555;
            }
            .singinform a{
                text-decoration: none;
                color: #2575fc;
                font-size: 1.1rem;
                font-weight: bolder;
                margin-top: 80px auto;
                text-align: center;
            }
            @media screen and (max-width: 768px){
                .form-container{
                padding: 30px;
                border-radius: 5px 50px 5px ;
                width: 90%;
                max-width: 400px;
                overflow: hidden;

                }

            }



        </style>


    <body>
        <div class="background-circle"></div>
        <div class="background-circle"></div>
        <div class="background-circle"></div>
        <div class="form-container">
            <div id="singinform">
                <h2>GAL</h2>
                <div class="form-group">
                    <label for="singinEmail">Email</label>
                    <input type="email" id="singinEmail" 
                    placeholder="Geli emailkaaga" required />
                </div>
                <div class="form-group">
                    <label for="singinPassword">Password</label>
                    <input type="password" id="singinPassword" 
                    placeholder="Geli furaha sirta ah" required />
                </div>
                <button type="submit">Gal
                </button>
                <div class="social-icon-buttons">
                    <i class="fa-brands fa-google"></i>
                    <i class="fa-brands fa-facebook-f"></i>
                    
                </div>
                <a href="#">Dib u laabo</a>
            </div>
        </div>
        
    </body>
</html>
